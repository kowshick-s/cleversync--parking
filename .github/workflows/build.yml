name: Build Cleversync Parking APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze code (non-blocking)
        run: flutter analyze --no-fatal-infos || true

      - name: Build Release APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cleversync-Parking-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Cleversync Parking v${{ github.run_number }}"
          body: |
            ## Cleversync Parking APK
            
            ### What's included:
            - Entry & Exit management
            - Members / Pass system
            - Reports & Analytics
            - Bluetooth thermal printer support
            - Security verification checklist
            
            ### Install on Android:
            1. Download `app-release.apk` below
            2. Enable "Install unknown apps" on your phone
            3. Open the APK and install
            
            **Default Login:** username: `admin` | password: `admin123`
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
